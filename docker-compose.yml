services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gracitas:latest
    container_name: gracitas_app
    restart: unless-stopped
    ports:
      - "8000:80"
      - "8080:8080"
    environment:
      APP_NAME: "GraCitas"
      APP_ENV: "local"
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: "mysql"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_DATABASE: "gracitas"
      DB_USERNAME: "gracitas_user"
      DB_PASSWORD: "secret_password"
      AUTO_MIGRATE: "true"
      AUTO_SEED: "true"
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: gracitas_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "gracitas"
      MYSQL_USER: "gracitas_user"
      MYSQL_PASSWORD: "secret_password"
      MYSQL_ROOT_PASSWORD: "root_password"
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./gracitas.sql:/docker-entrypoint-initdb.d/01_gracitas.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: gracitas_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: "db"
      PMA_PORT: "3306"
    depends_on:
      - db

volumes:
  db_data:
    driver: local
  storage_data:
    driver: local
